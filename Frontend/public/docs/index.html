<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive REST API documentation for the Rise Above Foundation Cebu Donation and Relief Management System." />
    <title>Rise Above Foundation API Documentation</title>
    <link rel="icon" href="/favicon.png" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css" />
    <style>
      :root { color-scheme: light; --raf-red: #af101a; --raf-dark-red: #7f0912; --raf-ink: #172033; }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { margin: 0; background: #f7f8fb; color: var(--raf-ink); }
      .docs-header { display: flex; align-items: center; gap: 14px; padding: 18px clamp(18px, 4vw, 56px); color: #fff; background: linear-gradient(135deg, var(--raf-dark-red), var(--raf-red)); box-shadow: 0 8px 28px rgba(127, 9, 18, .2); }
      .docs-header img { width: 46px; height: 46px; object-fit: contain; border-radius: 50%; background: #fff; }
      .docs-header h1 { margin: 0; font: 700 clamp(1.05rem, 2vw, 1.4rem)/1.2 system-ui, sans-serif; }
      .docs-header p { margin: 4px 0 0; color: rgba(255,255,255,.82); font: 400 .82rem/1.4 system-ui, sans-serif; }
      .docs-header a { margin-left: auto; padding: 9px 13px; border: 1px solid rgba(255,255,255,.4); border-radius: 9px; color: #fff; font: 600 .8rem system-ui, sans-serif; text-decoration: none; white-space: nowrap; }
      #swagger-ui { max-width: 1500px; margin: 0 auto; padding: 10px clamp(4px, 2vw, 24px) 44px; }
      .swagger-ui { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: var(--raf-ink); }
      .swagger-ui .topbar { display: none; }
      .swagger-ui .info { margin: 28px 0 22px; }
      .swagger-ui .info .title { color: var(--raf-ink); }
      .swagger-ui .info a { color: var(--raf-red); }
      .swagger-ui .scheme-container { border-radius: 12px; box-shadow: 0 5px 20px rgba(15,23,42,.08); }
      .swagger-ui .btn.authorize { color: var(--raf-red); border-color: var(--raf-red); }
      .swagger-ui .btn.authorize svg { fill: var(--raf-red); }
      .swagger-ui .opblock-tag { color: #263248; }
      .swagger-ui .opblock { border-radius: 9px; overflow: hidden; box-shadow: 0 2px 8px rgba(15,23,42,.04); }
      .swagger-ui .opblock .opblock-summary-method { border-radius: 6px; }
      .swagger-ui .model-box { border-radius: 8px; }
      .docs-error { max-width: 760px; margin: 60px auto; padding: 24px; border: 1px solid #fecaca; border-radius: 12px; background: #fff; color: #991b1b; font-family: system-ui, sans-serif; }
      @media (max-width: 640px) { .docs-header { align-items: flex-start; flex-wrap: wrap; } .docs-header a { margin-left: 60px; } #swagger-ui { padding-inline: 0; } }
    </style>
  </head>
  <body>
    <header class="docs-header">
      <img src="/logo.png" alt="Rise Above Foundation Cebu" />
      <div>
        <h1>Rise Above Foundation API</h1>
        <p>Donation, inventory, relief allocation, and distribution services</p>
      </div>
      <a href="/" aria-label="Return to the main system">Return to system</a>
    </header>
    <main id="swagger-ui" aria-label="Interactive API documentation"></main>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-standalone-preset.js" crossorigin="anonymous"></script>
    <script>
      window.addEventListener('DOMContentLoaded', function () {
        if (!window.SwaggerUIBundle) {
          document.getElementById('swagger-ui').innerHTML = '<div class="docs-error"><strong>Documentation assets could not be loaded.</strong><br />Check your network connection and reload this page.</div>';
          return;
        }
        window.ui = SwaggerUIBundle({
          url: './openapi.json',
          dom_id: '#swagger-ui',
          deepLinking: true,
          displayRequestDuration: true,
          filter: true,
          persistAuthorization: true,
          requestSnippetsEnabled: true,
          tryItOutEnabled: false,
          validatorUrl: null,
          presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
          layout: 'StandaloneLayout'
        });
      });
    </script>
  </body>
</html>
